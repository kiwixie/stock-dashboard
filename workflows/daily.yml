name: 每日股票扫描

on:
  schedule:
    - cron: "30 1 * * *"  # 对应北京时间 9:30，会自动按这个时间跑
  workflow_dispatch:  # 手动触发按钮，测试用

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scan
        run: python stock_scan.py
      - name: Commit result
        run: |
          git config --global user.name "auto"
          git config --global user.email "auto@github.com"
          git add stock_result.csv
          git commit -m "auto update $(date)" || echo "No changes to commit"
          git push
